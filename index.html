<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Particle Interface</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
        }

        /* --- CORREÇÃO: Vídeo Visível --- */
        #input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Garante que preencha a tela sem distorcer */
            z-index: 0; /* Camada mais baixa (fundo) */
            transform: scaleX(-1); /* Espelha a imagem para parecer um espelho real */
            filter: contrast(1.1) brightness(0.7) grayscale(0.2); /* Filtro Cyberpunk (mais escuro e contrastado) */
        }

        /* Three.js Canvas */
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Acima do vídeo */
            pointer-events: none;
        }

        /* Cyberpunk Overlay Effects */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Ajuste leve para ver o vídeo atrás */
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%, /* Escurecido levemente */
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2; /* Acima das partículas */
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Vinheta para focar no centro */
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* HUD Styling */
        .hud-panel {
            position: absolute;
            color: #00FFFF;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 4; /* Interface no topo */
            text-shadow: 0 0 5px #00FFFF;
        }

        #hud-tl { top: 20px; left: 20px; }
        #hud-tr { top: 20px; right: 20px; text-align: right; }
        #hud-bl { bottom: 20px; left: 20px; }
        #hud-br { bottom: 20px; right: 20px; text-align: right; }

        .data-val { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <video id="input_video"></video>

    <canvas id="output_canvas"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div id="hud-tl" class="hud-panel">
        FPS: <span id="fps-val" class="data-val">0</span><br>
        PARTICLES: <span class="data-val">12000</span>
    </div>
    <div id="hud-tr" class="hud-panel">
        SYS: <span class="data-val">ONLINE</span><br>
        MODE: <span id="mode-val" class="data-val">INIT</span>
    </div>
    <div id="hud-bl" class="hud-panel">
        L.HAND: <span id="l-hand-val" class="data-val">SEARCHING</span>
    </div>
    <div id="hud-br" class="hud-panel">
        R.HAND: <span id="r-hand-val" class="data-val">SEARCHING</span>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 12000;
        const PARTICLE_SIZE = 2.4;
        const LERP_FACTOR = 0.16;
        const FONT_SIZE = 75;
        
        // Colors
        const C_BLUE = new THREE.Color(0x00FFFF);
        const C_YELLOW = new THREE.Color(0xFFFF00);
        const C_PINK = new THREE.Color(0xFF00FF);
        const C_GREEN = new THREE.Color(0x00FF88);
        const C_ORANGE = new THREE.Color(0xFF8800);

        // --- THREE.JS SETUP ---
        const canvas = document.getElementById('output_canvas');
        // Alpha true permite ver o vídeo através do canvas
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Importante: setClearColor alpha 0 para transparência total
        renderer.setClearColor(0x000000, 0); 

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.z = 100;

        // --- PARTICLE SYSTEM ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targets = new Float32Array(PARTICLE_COUNT * 3); 
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 200;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
            
            targets[i * 3] = positions[i * 3];
            targets[i * 3 + 1] = positions[i * 3 + 1];
            targets[i * 3 + 2] = 0;

            colors[i * 3] = C_BLUE.r;
            colors[i * 3 + 1] = C_BLUE.g;
            colors[i * 3 + 2] = C_BLUE.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
            opacity: 0.9
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- TEXT / SHAPE GENERATOR ---
        const textCanvas = document.createElement('canvas');
        const tCtx = textCanvas.getContext('2d');
        textCanvas.width = 400; 
        textCanvas.height = 200;

        function generateTextTargets(text, color) {
            tCtx.fillStyle = '#000000';
            tCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);
            
            tCtx.font = `bold ${FONT_SIZE}px "Orbitron", sans-serif`;
            tCtx.fillStyle = '#FFFFFF';
            tCtx.textAlign = 'center';
            tCtx.textBaseline = 'middle';
            tCtx.fillText(text, textCanvas.width / 2, textCanvas.height / 2);

            const imageData = tCtx.getImageData(0, 0, textCanvas.width, textCanvas.height);
            const data = imageData.data;
            const validPixels = [];

            for (let y = 0; y < textCanvas.height; y += 2) {
                for (let x = 0; x < textCanvas.width; x += 2) {
                    const index = (y * textCanvas.width + x) * 4;
                    if (data[index] > 128) { 
                        validPixels.push({
                            x: (x - textCanvas.width / 2) * 0.5, 
                            y: -(y - textCanvas.height / 2) * 0.5
                        });
                    }
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < validPixels.length * 4) { 
                    const p = validPixels[i % validPixels.length];
                    targets[i * 3] = p.x;
                    targets[i * 3 + 1] = p.y;
                    targets[i * 3 + 2] = 0;
                } else {
                    targets[i * 3] = (Math.random() - 0.5) * 300;
                    targets[i * 3 + 1] = (Math.random() - 0.5) * 300;
                    targets[i * 3 + 2] = (Math.random() - 0.5) * 100;
                }
                
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }
            geometry.attributes.color.needsUpdate = true;
        }

        // --- STATE MANAGEMENT ---
        const state = {
            leftHand: { detected: false, fingers: 0, pos: new THREE.Vector3() },
            rightHand: { detected: false, fingers: 0, pos: new THREE.Vector3() },
            mode: 'TEXT'
        };

        // --- MEDIAPIPE LOGIC ---
        const videoElement = document.getElementById('input_video');
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        function countFingers(landmarks) {
            let count = 0;
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            
            tips.forEach((tip, i) => {
                if (landmarks[tip].y < landmarks[pips[i]].y) count++;
            });

            const thumbTip = landmarks[4];
            const thumbIP = landmarks[3];
            const pinkyMCP = landmarks[17];
            
            if (distance(thumbTip, pinkyMCP) > distance(thumbIP, pinkyMCP)) {
                count++;
            }
            return count;
        }

        function distance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function landmarksToVector(lm) {
            // Ajustado para coincidir com o vídeo espelhado no CSS
            const x = (lm.x - 0.5) * -1 * (window.innerWidth / window.innerHeight * 100); 
            const y = (lm.y - 0.5) * -1 * 100; 
            return new THREE.Vector3(x, y, 0);
        }

        let currentTextState = -1;

        hands.onResults((results) => {
            state.leftHand.detected = false;
            state.rightHand.detected = false;

            if (results.multiHandLandmarks && results.multiHandedness) {
                for (let index = 0; index < results.multiHandLandmarks.length; index++) {
                    const classification = results.multiHandedness[index];
                    const landmarks = results.multiHandLandmarks[index];
                    const fingers = countFingers(landmarks);
                    const pos = landmarksToVector(landmarks[8]); 
                    const palmPos = landmarksToVector(landmarks[0]); 

                    if (classification.label === 'Left') {
                        state.leftHand.detected = true;
                        state.leftHand.fingers = fingers;
                        state.leftHand.pos = palmPos;
                    } else {
                        state.rightHand.detected = true;
                        state.rightHand.fingers = fingers;
                        state.rightHand.pos = pos; 
                        state.rightHand.palm = palmPos;
                    }
                }
            }

            // Logic remains identical
            if (state.rightHand.detected && state.rightHand.fingers === 5 && 
                state.leftHand.detected && state.leftHand.fingers === 5) {
                state.mode = 'COMBO';
                updateHUD('ULTIMATE: DUNK');
                return;
            }

            if (state.rightHand.detected && state.rightHand.fingers === 5) {
                state.mode = 'NEBULA';
                updateHUD('NEBULA SCATTER');
            } else {
                state.mode = 'TEXT'; 
                updateHUD('TEXT / INTERACT');
            }

            if (state.leftHand.detected) {
                if (state.leftHand.fingers === 5) {
                   updateHUD('CATCH MODE');
                } else if (state.leftHand.fingers !== currentTextState && state.mode === 'TEXT') {
                    currentTextState = state.leftHand.fingers;
                    switch(state.leftHand.fingers) {
                        case 0: break;
                        case 1: generateTextTargets("Hello", C_BLUE); break;
                        case 2: generateTextTargets("Gemini3", C_YELLOW); break;
                        case 3: generateTextTargets("非常好用", C_PINK); break;
                        case 4: generateTextTargets("再见", C_GREEN); break;
                    }
                }
            } else if (state.mode === 'TEXT' && currentTextState === -1) {
                generateTextTargets("SYSTEM READY", C_BLUE);
                currentTextState = 0;
            }

            document.getElementById('l-hand-val').innerText = state.leftHand.detected ? `ACTV (${state.leftHand.fingers})` : 'SEARCHING';
            document.getElementById('r-hand-val').innerText = state.rightHand.detected ? `ACTV (${state.rightHand.fingers})` : 'SEARCHING';
            document.getElementById('l-hand-val').style.color = state.leftHand.detected ? '#00FF00' : '#00FFFF';
            document.getElementById('r-hand-val').style.color = state.rightHand.detected ? '#00FF00' : '#00FFFF';
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        cameraUtils.start();

        function updateHUD(text) {
            document.getElementById('mode-val').innerText = text;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            const positionsArray = geometry.attributes.position.array;
            const colorsArray = geometry.attributes.color.array;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const px = positionsArray[i * 3];
                const py = positionsArray[i * 3 + 1];
                const pz = positionsArray[i * 3 + 2];

                let tx = targets[i * 3];
                let ty = targets[i * 3 + 1];
                let tz = targets[i * 3 + 2];

                if (state.mode === 'COMBO') {
                    const offset = 2 / PARTICLE_COUNT;
                    const increment = Math.PI * (3 - Math.sqrt(5));
                    
                    const y = ((i * offset) - 1) + (offset / 2);
                    const r = Math.sqrt(1 - Math.pow(y, 2));
                    const phi = ((i + 1) % PARTICLE_COUNT) * increment + (time * 2);

                    const sphereRadius = 25;
                    const sx = Math.cos(phi) * r * sphereRadius;
                    const sy = y * sphereRadius;
                    const sz = Math.sin(phi) * r * sphereRadius;

                    tx = state.leftHand.pos.x + sx;
                    ty = state.leftHand.pos.y + sy;
                    tz = sz; 

                    const isLine = (Math.abs(sx) < 1.5) || (Math.abs(sz) < 1.5 && Math.abs(sy) > 10);
                    
                    if (isLine) {
                         colorsArray[i*3] = 0; colorsArray[i*3+1] = 0; colorsArray[i*3+2] = 0;
                    } else {
                         colorsArray[i*3] = C_ORANGE.r; colorsArray[i*3+1] = C_ORANGE.g; colorsArray[i*3+2] = C_ORANGE.b;
                    }

                    const bounce = Math.abs(Math.sin(time * 15)) * 0.5;
                    ty += bounce * 2;
                }

                else if (state.mode === 'NEBULA') {
                    tx = (Math.sin(i) * window.innerWidth/4);
                    ty = (Math.cos(i) * window.innerHeight/4);
                    tz = (Math.sin(i * 0.5) * 200);

                    const dx = px - state.rightHand.pos.x;
                    const dy = py - state.rightHand.pos.y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    
                    if (d < 60) {
                        const ripple = Math.sin(d * 0.5 - time * 10) * 10;
                        tz += ripple;
                    }
                    colorsArray[i*3] = C_BLUE.r; colorsArray[i*3+1] = C_BLUE.g; colorsArray[i*3+2] = C_BLUE.b;
                }
                
                else {
                    if (state.leftHand.detected && state.leftHand.fingers === 5) {
                         const dx = px - state.leftHand.pos.x;
                         const dy = py - state.leftHand.pos.y;
                         const d = Math.sqrt(dx*dx + dy*dy);
                         if (d > 10) {
                             tx = state.leftHand.pos.x + (Math.random()-0.5)*50;
                             ty = state.leftHand.pos.y + (Math.random()-0.5)*50;
                         }
                    }
                }

                positionsArray[i * 3] += (tx - px) * LERP_FACTOR;
                positionsArray[i * 3 + 1] += (ty - py) * LERP_FACTOR;
                positionsArray[i * 3 + 2] += (tz - pz) * LERP_FACTOR;

                if (state.mode === 'TEXT' && state.rightHand.detected && state.rightHand.fingers < 5) {
                    const hx = state.rightHand.pos.x;
                    const hy = state.rightHand.pos.y;
                    
                    const dx = positionsArray[i * 3] - hx;
                    const dy = positionsArray[i * 3 + 1] - hy;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const radius = 35; 

                    if (dist < radius) {
                        const force = (radius - dist) / radius;
                        const angle = Math.atan2(dy, dx);
                        const strength = 15; 

                        positionsArray[i * 3] += Math.cos(angle) * force * strength;
                        positionsArray[i * 3 + 1] += Math.sin(angle) * force * strength;
                    }
                }
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            
            document.getElementById('fps-val').innerText = Math.round(1 / clock.getDelta());
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
